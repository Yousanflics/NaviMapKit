allow_zero_lintable_files: true

included:
  - Sources
  - Tests
  - Examples

excluded:
  - "**/Generated"
  - "**/.build"
  - "**/DerivedData"

disabled_rules:
  - comment_spacing
  - computed_accessors_order
  - force_try
  - identifier_name
  - line_length
  - nesting
  - shorthand_operator
  - todo
  - trailing_comma
  - trailing_whitespace
  - type_name
  - type_body_length
  - large_tuple
  - file_length
  - function_body_length
  - function_parameter_count
  - cyclomatic_complexity
  - vertical_whitespace
  - colon
  - opening_brace

custom_rules:
  trojan_source:
    regex: "[\u202A\u202B\u202D\u202E\u2066\u2067\u2068\u202C\u2069]"
    severity: error
    message: "Source should not contain characters that may be used in reordering attacks. See https://trojansource.codes/trojan-source.pdf"
